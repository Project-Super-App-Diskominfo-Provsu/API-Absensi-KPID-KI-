name: absensi-kpid-ki
services:
  api:
    image: absensi-api:${APP_IMAGE_TAG:-local}
    build:
      context: .
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      FCM_ENABLED: ${FCM_ENABLED:-false}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in the deployment environment or .env}
      DB_POOL_MAX: ${DB_POOL_MAX:-15}
      DB_MIGRATE_ON_START: ${DB_MIGRATE_ON_START:-true}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL in the deployment environment or .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the deployment environment or .env}
      BIOMETRIC_KEY_BASE64: ${BIOMETRIC_KEY_BASE64:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      WEB_AUTH_ENABLED: ${WEB_AUTH_ENABLED:-false}
      ADMIN_WEB_ORIGIN: ${ADMIN_WEB_ORIGIN:-}
      GOOGLE_ENABLED: ${GOOGLE_ENABLED:-false}
      GOOGLE_EMAIL_LINKING_ENABLED: ${GOOGLE_EMAIL_LINKING_ENABLED:-false}
      GOOGLE_WEB_CLIENT_ID: ${GOOGLE_WEB_CLIENT_ID:-}
      GOOGLE_ANDROID_CLIENT_IDS: ${GOOGLE_ANDROID_CLIENT_IDS:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      TRUST_PROXY: ${TRUST_PROXY:-}
      SSO_ENABLED: ${SSO_ENABLED:-false}
      SSO_ISSUER: ${SSO_ISSUER:-}
      SSO_CLIENT_ID: ${SSO_CLIENT_ID:-}
      SSO_CLIENT_SECRET: ${SSO_CLIENT_SECRET:-}
      SSO_REDIRECT_URI: ${SSO_REDIRECT_URI:-}
      SSO_TOKEN_AUTH_METHOD: ${SSO_TOKEN_AUTH_METHOD:-none}
      FACE_WORKER_URL: http://face-worker:8000
      FACE_WORKER_TOKEN: ${FACE_WORKER_TOKEN:-}
      NOTIFICATION_WORKER_URL: http://notification-worker:8001
      FACE_MODEL_VERSION: ${FACE_MODEL_VERSION:-}
      FACE_MATCH_THRESHOLD: ${FACE_MATCH_THRESHOLD:-}
      FACE_REVIEW_THRESHOLD: ${FACE_REVIEW_THRESHOLD:-}
      FACE_LIVENESS_THRESHOLD: ${FACE_LIVENESS_THRESHOLD:-}
      FACE_QUALITY_THRESHOLD: ${FACE_QUALITY_THRESHOLD:-}
    ports: ["127.0.0.1:${API_HOST_PORT:-3000}:3000"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/ready/auth').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 180s
      retries: 3
  notification-worker:
    profiles: [notifications]
    image: absensi-api:${APP_IMAGE_TAG:-local}
    build:
      context: .
    command: ["node", "dist/notification-worker.js"]
    init: true
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      DB_POOL_MAX: ${DB_POOL_MAX:-15}
      FCM_ENABLED: ${FCM_ENABLED:-false}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-admin.json
      FIREBASE_SERVICE_ACCOUNT_BASE64: ${FIREBASE_SERVICE_ACCOUNT_BASE64:-}
      NOTIFICATION_WORKER_PORT: "8001"
      NOTIFICATION_POLL_MS: ${NOTIFICATION_POLL_MS:-10000}
    volumes:
      - type: bind
        source: ${GOOGLE_APPLICATION_CREDENTIALS:-./config/firebase-admin.placeholder.json}
        target: /run/secrets/firebase-admin.json
        read_only: true
        bind:
          create_host_path: false
    extra_hosts: ["host.docker.internal:host-gateway"]
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 25s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8001/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
  face-worker:
    profiles: [biometrics]
    image: absensi-face-worker:${APP_IMAGE_TAG:-local}
    build:
      context: .
      target: face-worker
    command: ["node", "--env-file-if-exists=/app/.env", "dist/worker/server.js"]
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: production
      FACE_WORKER_PORT: "8000"
      FACE_ALLOW_RESEARCH_MODELS: ${FACE_ALLOW_RESEARCH_MODELS:-false}
      FACE_WORKER_TOKEN: ${FACE_WORKER_TOKEN:-}
      FACE_MANIFEST_PATH: ${FACE_WORKER_MANIFEST_PATH:-/app/models/research/manifest.json}
    volumes:
      - type: bind
        source: ${FACE_MODELS_PATH:-./models}
        target: /app/models
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/ready',{headers:{authorization:'Bearer '+process.env.FACE_WORKER_TOKEN}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
