name: API checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: absensi
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: absensi
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U absensi -d absensi"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["56379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
      postgres_legacy:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: absensi
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: absensi
        ports: ["55433:5432"]
        options: >-
          --health-cmd "pg_isready -U absensi -d absensi"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      ONNXRUNTIME_NODE_INSTALL: skip
      TEST_DATABASE_URL: postgresql://absensi:test-password@localhost:55432/absensi
      TEST_REDIS_URL: redis://localhost:56379
      TEST_LEGACY_DATABASE_URL: postgresql://absensi:test-password@localhost:55433/absensi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run check:architecture
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
      - run: npm audit --audit-level=high
      - run: docker build -t absensi-api:ci .
      - name: Verify native dependencies in production image
        run: >-
          docker run --rm absensi-api:ci node --input-type=module -e
          'import argon2 from "argon2"; import sharp from "sharp"; import * as ort from "onnxruntime-node";
          if (!(await argon2.verify(await argon2.hash("ci-smoke-password"), "ci-smoke-password"))) process.exit(1);
          if (!sharp.versions.sharp || typeof ort.InferenceSession.create !== "function") process.exit(1);'
