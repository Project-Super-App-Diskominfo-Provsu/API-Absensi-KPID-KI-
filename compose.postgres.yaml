name: absensi-datastore
services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    image: ${POSTGRES_IMAGE:-absensi-postgres-postgis:17}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-absensi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD for the database container}
      POSTGRES_DB: ${POSTGRES_DB:-absensi}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-absensi} -d ${POSTGRES_DB:-absensi}"]
      interval: 5s
      timeout: 3s
      retries: 5


volumes:
  postgres_data:
